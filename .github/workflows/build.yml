# SPDX-License-Identifier: Apache-2.0
name: Build image

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"   # daily: testing channel
    - cron: "41 5 * * 0"   # Sundays: stable channel
  workflow_dispatch:
    inputs:
      channel:
        description: "testing or stable"
        default: testing

permissions:
  contents: read

env:
  BOOTC_TAG: v1.17.4
  REGISTRY: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootc:
    name: bootc builder (cached per tag)
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Choose builder image
        id: ref
        run: echo "ref=${REGISTRY}/brahma-os-bootc:${BOOTC_TAG}" >> "$GITHUB_OUTPUT"
      - name: Build bootc if this tag is not published yet
        env:
          REF: ${{ steps.ref.outputs.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          PUBLISH: ${{ github.event_name != 'pull_request' }}
        run: |
          if skopeo inspect "docker://${REF}" >/dev/null 2>&1; then
            echo "Builder ${REF} already published"; exit 0
          fi
          sudo podman build -f bootc-builder/Containerfile --build-arg BOOTC_TAG="${BOOTC_TAG}" \
            -t "${REF}" bootc-builder
          if [ "${PUBLISH}" = true ]; then
            echo "${GITHUB_TOKEN}" | sudo podman login -u "${ACTOR}" --password-stdin ghcr.io
            sudo podman push "${REF}"
          else
            mkdir -p build && sudo podman save --format oci-archive -o build/bootc-builder.tar "${REF}"
          fi
      - name: Pass the unpublished builder to the next job (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootc-builder
          path: build/bootc-builder.tar
          retention-days: 1
          if-no-files-found: ignore

  image:
    name: Build, test, publish
    needs: bootc
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true

      - name: Channel and tags
        id: tags
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          channel=testing
          [ "${SCHEDULE}" = "41 5 * * 0" ] && channel=stable
          [ "${EVENT}" = workflow_dispatch ] && channel="${INPUT_CHANNEL}"
          case "$channel" in testing|stable) ;; *) echo "bad channel"; exit 1;; esac
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Get the builder from the previous job (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: bootc-builder
          path: build

      - name: Build
        env:
          BOOTC_BUILDER: ${{ needs.bootc.outputs.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "${GITHUB_TOKEN}" | sudo podman login -u "${ACTOR}" --password-stdin ghcr.io
          if [ -f build/bootc-builder.tar ]; then sudo podman load -i build/bootc-builder.tar; fi
          sudo podman pull "${BOOTC_BUILDER}" 2>/dev/null || true
          sudo podman build -f image/Containerfile --build-arg BOOTC_BUILDER="${BOOTC_BUILDER}" \
            -t localhost/brahma-os:latest .

      - name: Rechunk (smaller, update-friendly layers)
        run: |
          export CHUNKAH_CONFIG_STR="$(sudo podman inspect localhost/brahma-os:latest)"
          sudo -E podman run --rm --mount=type=image,src=localhost/brahma-os:latest,target=/chunkah \
            -e CHUNKAH_CONFIG_STR quay.io/coreos/chunkah:v0.7.1 build \
            --label ostree.bootable=1 --label containers.bootc=1 --compressed --max-layers 128 \
            | sudo podman load | sort -n | head -n1 | cut -d, -f2 | cut -d: -f3 \
            | xargs -I{} sudo podman tag {} localhost/brahma-os:latest

      - name: Boot test in QEMU
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86 ovmf >/dev/null
          sudo chmod 666 /dev/kvm || true
          mkdir -p build && ssh-keygen -q -t ed25519 -N '' -f build/ci_key
          sudo scripts/disk.sh build/brahma-os.img build/ci_key.pub
          sudo chown "$(id -u)" build/brahma-os.img
          scripts/smoke.sh build/brahma-os.img build/ci_key

      - name: Upload boot log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serial-log
          path: build/serial.log
          if-no-files-found: ignore

      - name: Push to ghcr.io
        if: github.event_name != 'pull_request'
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          CHANNEL: ${{ steps.tags.outputs.channel }}
          DATE: ${{ steps.tags.outputs.date }}
        run: |
          echo "${GITHUB_TOKEN}" | sudo podman login -u "${ACTOR}" --password-stdin ghcr.io
          echo "${GITHUB_TOKEN}" | docker login -u "${ACTOR}" --password-stdin ghcr.io  # for cosign
          dest="${REGISTRY}/brahma-os"
          for tag in "${CHANNEL}" "${CHANNEL}-${DATE}"; do
            # Pushed twice so layer annotations are present (containers/podman#27796).
            for n in 1 2; do
              sudo podman push --digestfile=/tmp/digest localhost/brahma-os:latest "${dest}:${tag}"
            done
          done
          echo "digest=$(cat /tmp/digest)" >> "$GITHUB_OUTPUT"
          echo "ref=${dest}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMG: ${{ steps.push.outputs.ref }}@${{ steps.push.outputs.digest }}
        run: cosign sign -y --key env://COSIGN_PRIVATE_KEY "${IMG}"

      - name: SBOM
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.push.outputs.ref }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: build/sbom.spdx.json
          upload-artifact: true

      - name: Attach SBOM to the image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMG: ${{ steps.push.outputs.ref }}@${{ steps.push.outputs.digest }}
        run: cosign attest -y --key env://COSIGN_PRIVATE_KEY --type spdxjson --predicate build/sbom.spdx.json "${IMG}"
